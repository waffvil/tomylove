<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>the girls' house ♡</title>
<meta name="description" content="mivi, vimi and teddy's little house">
<meta name="theme-color" content="#ffb7d0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 56C10 40 4 28 12 18c6-7 15-6 20 2 5-8 14-9 20-2 8 10 2 22-20 38z' fill='%23ffb7d0' stroke='%236b3a55' stroke-width='5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Pixelify+Sans:wght@400;600&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ffb7d0;
    --pink-deep: #f48fb4;
    --pink-soft: #ffe1ec;
    --yellow: #fff1a8;
    --yellow-deep: #ffd966;
    --cream: #fffaf0;
    --ink: #6b3a55;
    --white: #ffffff;
    --pixel: "Pixelify Sans", ui-monospace, monospace;
    --bubble: "Bagel Fat One", "Nunito", system-ui, sans-serif;
    --body: "Nunito", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    color: var(--ink);
    font-family: var(--body);
    background-color: #fff3c4;
    background-image:
      repeating-linear-gradient(0deg,
        rgba(255,170,200,.38) 0 34px, transparent 34px 50px,
        rgba(255,255,255,.85) 50px 52px, transparent 52px 55px,
        rgba(255,255,255,.85) 55px 57px, transparent 57px 60px,
        rgba(255,255,255,.85) 60px 62px, transparent 62px 90px,
        rgba(255,205,90,.55) 90px 94px, transparent 94px 120px),
      repeating-linear-gradient(90deg,
        rgba(255,170,200,.38) 0 34px, transparent 34px 50px,
        rgba(255,255,255,.85) 50px 52px, transparent 52px 55px,
        rgba(255,255,255,.85) 55px 57px, transparent 57px 60px,
        rgba(255,255,255,.85) 60px 62px, transparent 62px 90px,
        rgba(255,205,90,.55) 90px 94px, transparent 94px 120px);
    padding: 10px 10px calc(14px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }

  .top { display: flex; align-items: center; gap: 8px; margin: 0 auto 10px; max-width: 1400px; }
  .top h1 { flex: 1; margin: 0; font: 400 clamp(20px, 5vw, 30px)/1 var(--bubble); color: var(--white);
    -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; text-shadow: 3px 3px 0 var(--ink); }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    font: 600 14px/1 var(--pixel); color: var(--ink); text-decoration: none;
    background: var(--yellow); border: 2px solid var(--ink); border-radius: 999px;
    padding: 8px 12px; box-shadow: 2px 2px 0 var(--ink); cursor: pointer;
  }
  .pill.white { background: var(--white); }
  .pill:active { transform: translate(2px,2px); box-shadow: none; }

  .win {
    max-width: 1400px; margin: 0 auto;
    background: var(--cream);
    border: 3px solid var(--ink); border-radius: 14px;
    box-shadow: 5px 5px 0 var(--ink);
    overflow: hidden;
  }
  .titlebar {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 10px;
    background: linear-gradient(90deg, var(--pink) 0%, #ffd0de 55%, var(--yellow) 100%);
    border-bottom: 3px solid var(--ink);
    font: 600 14px/1.2 var(--pixel);
  }
  .titlebar .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #clock { font: 600 14px/1 var(--pixel); }

  .stage-wrap { overflow-x: auto; overflow-y: hidden; background: var(--pink-soft); scrollbar-width: thin; }
  .stage { position: relative; margin: 0 auto; touch-action: none; user-select: none; -webkit-user-select: none; }
  .stage canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; cursor: pointer; }
  .overlay { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .bubble {
    position: absolute; transform: translate(-50%, -100%) scale(.8);
    white-space: nowrap;
    background: var(--white); border: 2px solid var(--ink); border-radius: 12px;
    padding: 4px 8px;
    font: 800 13px/1.2 var(--body); color: var(--ink);
    box-shadow: 2px 2px 0 var(--ink);
    opacity: 0; transition: opacity .15s, transform .15s;
  }
  .bubble.show { opacity: 1; transform: translate(-50%, -100%) scale(1); }
  .tag {
    position: absolute; transform: translate(-50%, 0);
    font: 600 12px/1 var(--pixel); color: var(--ink);
    background: var(--yellow); border: 2px solid var(--ink); border-radius: 999px;
    padding: 2px 7px; white-space: nowrap; opacity: 0; transition: opacity .2s;
  }
  .tag.show { opacity: 1; }

  .hint { margin: 0; padding: 8px 12px; font: 600 13px/1.3 var(--pixel); border-top: 3px solid var(--ink); background: var(--pink-soft); }

  .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 10px; }
  .kcard {
    background: var(--white); border: 3px solid var(--ink); border-radius: 14px;
    box-shadow: 3px 3px 0 var(--ink);
    padding: 8px; display: grid; gap: 6px;
    cursor: pointer;
    transition: transform .15s, background .2s;
  }
  .kcard.sel { background: #fff6c9; transform: translateY(-2px); }
  .khead { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .khead canvas { width: 40px; height: 42px; image-rendering: pixelated; flex: none; }
  .kname { font: 400 20px/1 var(--bubble); }
  .kact { font: 600 12px/1.2 var(--pixel); opacity: .85; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kmood { margin-left: auto; font-size: 20px; }
  .bars { display: grid; grid-template-columns: auto 1fr; gap: 3px 6px; align-items: center; font-size: 12px; }
  .bar { height: 8px; border: 2px solid var(--ink); border-radius: 999px; background: var(--cream); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--pink-deep); transition: width .4s; }
  .bar.e i { background: #9db8ff; } .bar.f i { background: var(--yellow-deep); } .bar.l i { background: #ff7fa8; }
  .kbtns { display: flex; flex-wrap: wrap; gap: 4px; }
  .kbtns button {
    flex: 1 1 auto;
    font: 600 12px/1 var(--pixel); color: var(--ink);
    background: var(--pink-soft); border: 2px solid var(--ink); border-radius: 8px;
    padding: 6px 4px; cursor: pointer; box-shadow: 2px 2px 0 var(--ink);
  }
  .kbtns button:active { transform: translate(2px,2px); box-shadow: none; }

  @media (max-width: 640px) {
    .cards { grid-template-columns: 1fr; }
    .kcard { grid-template-columns: 1fr 1fr; align-items: center; }
    .khead { grid-column: 1 / -1; }
  }
</style>
</head>
<body>

<div class="top">
  <a class="pill" href="./">← back</a>
  <h1>the girls' house</h1>
  <button class="pill white" type="button" id="soundBtn">🔊</button>
</div>

<div class="win">
  <div class="titlebar">
    <span>🏠</span><span class="name">house.exe — mivi, vimi &amp; teddy</span>
    <span id="clock"></span>
  </div>
  <div class="stage-wrap" id="wrap">
    <div class="stage" id="stage">
      <canvas id="scene" width="384" height="216" aria-label="the girls' house"></canvas>
      <div class="overlay" id="overlay"></div>
    </div>
  </div>
  <p class="hint">tap a girl to play · drag her anywhere · tap the fridge, tv, ball, flowers or swing ✿</p>
  <div class="cards" id="cards"></div>
</div>

<script src="kids.js"></script>
<script>
// ======================================================================
// the girls' house: a little cut-away dollhouse they live in.
// they choose what to do from how hungry / sleepy / bored / loved they are,
// it follows the real clock (they go to bed at night), and remembers everything.
// ======================================================================

const $ = (s) => document.querySelector(s);
const store = {
  get(k) { try { return localStorage.getItem("tomylove." + k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem("tomylove." + k, v); } catch {} },
};
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

// ---------- sounds (only when you touch things, never on their own) ----------
let ac = null;
let muted = store.get("muted") === "1";
function audio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; } }
  if (ac.state === "suspended") ac.resume();
  return ac;
}
function tone(freq, { type = "triangle", dur = 0.15, vol = 0.12, at = 0, slide = null } = {}) {
  if (muted || !ac) return;
  const t = ac.currentTime + at;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(ac.destination);
  o.start(t); o.stop(t + dur + 0.03);
}
const sfx = {
  squeak() { tone(1250, { type: "sine", slide: 1750, dur: 0.09, vol: 0.12 }); tone(1500, { type: "sine", slide: 2100, dur: 0.1, vol: 0.1, at: 0.11 }); },
  pop()    { tone(500, { type: "sine", slide: 1100, dur: 0.09, vol: 0.14 }); },
  boing()  { tone(180, { slide: 520, dur: 0.22, vol: 0.12 }); },
  kick()   { tone(160, { type: "sine", slide: 90, dur: 0.12, vol: 0.2 }); },
  water()  { [900, 1100, 1300].forEach((f, i) => tone(f, { type: "sine", slide: f * 0.7, dur: 0.08, vol: 0.06, at: i * 0.06 })); },
  tv()     { tone(2400, { type: "square", dur: 0.05, vol: 0.03 }); tone(60, { type: "sawtooth", dur: 0.15, vol: 0.04 }); },
  fridge() { tone(330, { dur: 0.1, vol: 0.08 }); tone(440, { dur: 0.12, vol: 0.08, at: 0.08 }); },
  lullaby() { [523.25, 523.25, 783.99, 783.99, 880, 880, 783.99].forEach((f, i) => tone(f, { type: "sine", dur: 0.55, vol: 0.07, at: i * 0.3 })); },
};
document.addEventListener("pointerdown", audio, { capture: true });
function renderSound() { $("#soundBtn").textContent = muted ? "🔈" : "🔊"; }
$("#soundBtn").addEventListener("click", () => { muted = !muted; store.set("muted", muted ? "1" : "0"); renderSound(); audio(); sfx.pop(); });
renderSound();

// ---------- the world ----------
const W = 384, H = 216;
const FLOOR = [196, 124];                 // feet height of the ground floor and upstairs
const RANGE = [[8, 376], [60, 290]];      // where they can walk on each floor
const HOLE = [268, 284];                  // the ladder hole in the upstairs floor
const LADDER = 276;
const BEDS = { rose: 54, blossom: 98, teddy: 142 };   // left edge of each girl's bed
const SEATS_TABLE = [{ x: 98, dir: 1 }, { x: 120, dir: 1, behind: true }, { x: 142, dir: -1 }];
const SEATS_SOFA = [182, 200, 218];
const SWING = { px: 361, py: 134, len: 44 };
const INK = "#4a2b3a";
const PAINT = {
  rose: ["#e2405a", "#ffb7d0", "#86b35a", "#fff1a8"],
  blossom: ["#f28aa2", "#fff1a8", "#7a9a62", "#cdb39c"],
  teddy: ["#c7a385", "#f6aaa0", "#4a2a24", "#ffd966"],
};

const canvas = $("#scene");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;

const world = {
  tv: false, tvT: 0,
  fridgeT: 0,
  ball: { x: 250, h: 0, vx: 0, vh: 0 },
  swing: { a: 0, v: 0 },
  flowers: [1.5, 2, 1, 2.5],
  easel: null, brush: { x: 7, y: 6 },
  parts: [],
  clouds: [{ x: 30, y: 30, s: 1 }, { x: 170, y: 18, s: 0.7 }, { x: 300, y: 40, s: 0.9 }],
  t: 0,
};
const EASEL_W = 14, EASEL_H = 11;
const blankEasel = () => new Array(EASEL_W * EASEL_H).fill(null);
world.easel = blankEasel();

// ---------- time of day (the real clock) ----------
function hourNow() { const d = new Date(); return d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600; }
const isNight = () => { const h = hourNow(); return h >= 22 || h < 7; };
const SKY = [ // hour, top colour, bottom colour, darkness
  [0, "#1f1838", "#3a2a5a", 0.5], [5, "#2a2048", "#4a3466", 0.45], [6.5, "#f4a6c1", "#ffe0b8", 0.12],
  [8, "#bfe3ff", "#fff3d6", 0], [17, "#c9e4ff", "#fff0d0", 0], [18.7, "#ffb48f", "#ffe3a8", 0.08],
  [19.8, "#e0739f", "#ffc0a8", 0.2], [21, "#3a2a5c", "#6b3a6b", 0.42], [24, "#1f1838", "#3a2a5a", 0.5],
];
const hex = (c) => [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16));
const mix = (a, b, t) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(",")})`; };
function skyNow() {
  const h = hourNow();
  for (let i = 0; i < SKY.length - 1; i++) {
    const [h0, t0, b0, d0] = SKY[i], [h1, t1, b1, d1] = SKY[i + 1];
    if (h >= h0 && h < h1) {
      const t = (h - h0) / (h1 - h0);
      return { top: mix(t0, t1, t), bottom: mix(b0, b1, t), dark: d0 + (d1 - d0) * t };
    }
  }
  return { top: SKY[0][1], bottom: SKY[0][2], dark: SKY[0][3] };
}

// ---------- tiny pixel drawing helpers ----------
function R(c, x, y, w, h, g = ctx) { g.fillStyle = c; g.fillRect(x, y, w, h); }
function box(g, x, y, w, h, fill) { R(INK, x, y, w, h, g); R(fill, x + 1, y + 1, w - 2, h - 2, g); }
function pixels(g, rows, x, y, colors) {
  rows.forEach((row, j) => [...row].forEach((ch, i) => { if (ch !== "." && colors[ch]) R(colors[ch], x + i, y + j, 1, 1, g); }));
}
function gingham(g, x, y, w, h, base, check, size = 4) {
  R(base, x, y, w, h, g);
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    const a = Math.floor((x + i) / size) % 2, b = Math.floor((y + j) / size) % 2;
    if (a || b) R(check, x + i, y + j, 1, 1, g);
  }
}
function plaidLines(g, x, y, w, h, base, line) {
  R(base, x, y, w, h, g);
  for (let i = 0; i < w; i++) { const m = (x + i) % 14; if (m === 0 || m === 2 || m === 4 || m === 9) R(line, x + i, y, 1, h, g); }
  for (let j = 0; j < h; j++) { const m = (y + j) % 14; if (m === 0 || m === 2 || m === 4 || m === 9) R(line, x, y + j, w, 1, g); }
}
function stripes(g, x, y, w, h, base, line, every = 6) {
  R(base, x, y, w, h, g);
  for (let i = 0; i < w; i++) if ((x + i) % every < 2) R(line, x + i, y, 1, h, g);
}

const HEART = [".x.x.", "xxxxx", ".xxx.", "..x.."];
const NOTE = [".xx", ".x.", ".x.", "xx."];
const ZED = ["xxx", "..x", ".x.", "xxx"];
const DROP = [".x.", "xxx", ".x."];

// ---------- the house itself (drawn once, the sky shows through) ----------
const bg = document.createElement("canvas");
bg.width = W; bg.height = H;
(function drawHouse() {
  const g = bg.getContext("2d");
  // far hills
  for (let x = 0; x < W; x++) {
    const h1 = 172 + Math.round(Math.sin(x / 28) * 6 + Math.sin(x / 11) * 2);
    R("#cfe9b8", x, h1, 1, 196 - h1, g);
    const h2 = 182 + Math.round(Math.sin(x / 19 + 2) * 4);
    R("#b9dfa0", x, h2, 1, 196 - h2, g);
  }
  // ground
  R("#a8d88a", 0, 196, W, 4, g); R("#86bf6b", 0, 196, W, 1, g);
  R("#e7c49d", 0, 200, W, 16, g);
  for (let i = 0; i < 70; i++) R(i % 2 ? "#d9b083" : "#f0d4b0", (i * 53) % W, 202 + ((i * 7) % 13), 2, 1, g);

  // picket fence in the garden
  for (let x = 302; x < W; x += 7) { box(g, x, 180, 5, 16, "#fffaf2"); R(INK, x + 2, 179, 1, 1, g); }
  R(INK, 300, 185, W - 300, 1, g); R("#fffaf2", 300, 186, W - 300, 2, g); R(INK, 300, 188, W - 300, 1, g);

  // cherry blossom tree with a branch for the swing
  box(g, 338, 124, 9, 72, "#b98a63");
  R("#a0734f", 341, 130, 2, 60, g);
  box(g, 344, 131, 30, 5, "#b98a63");
  [[342, 104, 25, "#ffc4d6"], [320, 116, 15, "#ffb7d0"], [366, 112, 16, "#ffc9da"], [350, 92, 15, "#ffd3e2"], [330, 92, 12, "#ffc4d6"]].forEach(([cx, cy, r, c]) => {
    for (let y = -r - 1; y <= r + 1; y++) for (let x = -r - 1; x <= r + 1; x++) {
      const d = x * x + y * y;
      if (d <= r * r) R(c, cx + x, cy + y, 1, 1, g);
      else if (d <= (r + 1) * (r + 1)) R(INK, cx + x, cy + y, 1, 1, g);
    }
  });
  for (let i = 0; i < 40; i++) R(i % 3 ? "#ff9fbf" : "#fff", 312 + (i * 37) % 60, 84 + (i * 23) % 42, 1, 1, g);

  // flower bed on the left
  box(g, 4, 192, 40, 5, "#c98f63");

  // chimney (behind the roof)
  box(g, 236, 18, 14, 28, "#e98aa8");
  for (let y = 22; y < 44; y += 5) R("#d27493", 237, y, 12, 1, g);
  box(g, 234, 16, 18, 4, "#f4a6c0");

  // roof
  for (let y = 16; y <= 56; y++) {
    const half = Math.round((y - 16) * (136 / 40));
    const x0 = 172 - half, x1 = 172 + half;
    R(INK, x0 - 1, y, x1 - x0 + 3, 1, g);
    R((y % 6 < 3) ? "#f6a5c0" : "#ef94b3", x0 + 1, y, x1 - x0 - 1, 1, g);
  }
  R(INK, 34, 56, 278, 2, g);
  // round attic window with a heart
  for (let y = -7; y <= 7; y++) for (let x = -7; x <= 7; x++) {
    const d = x * x + y * y;
    if (d <= 30) R("#fff6c9", 172 + x, 38 + y, 1, 1, g); else if (d <= 49) R(INK, 172 + x, 38 + y, 1, 1, g);
  }
  pixels(g, HEART, 170, 37, { x: "#f48fb4" });

  // walls and wallpaper
  gingham(g, 48, 58, 160, 66, "#ffe9f1", "#ffd6e5", 4);         // bedroom
  stripes(g, 208, 58, 88, 66, "#fff7d1", "#ffeaa0", 7);          // reading + art corner
  gingham(g, 48, 130, 112, 66, "#fff8dc", "#ffefb0", 4);         // kitchen
  plaidLines(g, 160, 130, 136, 66, "#fff0f5", "#ffc9da");        // living room, her pj plaid
  R(INK, 208, 58, 1, 30, g); R("#e9c9a8", 206, 88, 4, 3, g);     // little divider beam
  R(INK, 160, 130, 1, 26, g); R("#e9c9a8", 158, 156, 4, 3, g);
  // fairy lights along the bedroom ceiling (glow is drawn at night)
  for (let x = 52; x < 206; x++) R(INK, x, 60 + Math.round(Math.sin((x - 52) / 12) * 2 + 2), 1, 1, g);
  // outer walls, with open doors on the ground floor
  box(g, 44, 56, 5, 104, "#fff3df"); box(g, 295, 56, 5, 104, "#fff3df");
  R(INK, 44, 159, 5, 2, g); R(INK, 295, 159, 5, 2, g);
  box(g, 30, 160, 14, 36, "#f6a5c0"); R("#ffd966", 32, 178, 2, 2, g); // open front doors
  box(g, 300, 160, 14, 36, "#f6a5c0"); R("#ffd966", 310, 178, 2, 2, g);
  // upstairs floor, with a hole for the ladder
  box(g, 44, 124, HOLE[0] - 44 + 1, 7, "#d9a77a"); box(g, HOLE[1] - 1, 124, 300 - HOLE[1] + 1, 7, "#d9a77a");
  for (let x = 52; x < 296; x += 16) if (x < HOLE[0] - 2 || x > HOLE[1] + 2) R("#c08a5e", x, 126, 1, 4, g);
  // ground floor boards
  box(g, 44, 195, 256, 5, "#d9a77a");
  for (let x = 52; x < 296; x += 14) R("#c08a5e", x, 196, 1, 3, g);

  // --- bedroom ---
  Object.entries(BEDS).forEach(([id, bx], i) => {
    const head = ["#f6a5c0", "#ffd966", "#ffc4d6"][i];
    box(g, bx, 96, 5, 28, head);                    // headboard
    pixels(g, HEART, bx, 99, { x: "#fff" });
    box(g, bx + 36, 106, 5, 18, head);              // footboard
    box(g, bx + 4, 112, 33, 7, "#fffaf2");          // mattress
    box(g, bx + 4, 118, 33, 3, "#d9a77a");          // base
    R(INK, bx + 6, 121, 2, 3, g); R(INK, bx + 33, 121, 2, 3, g);
    box(g, bx + 5, 107, 10, 6, "#ffffff");          // pillow
    gingham(g, bx + 25, 109, 11, 4, "#fffbe8", "#ffc4d6", 3); R(INK, bx + 25, 108, 11, 1, g); // folded blanket
  });
  // bookshelf
  box(g, 214, 82, 24, 42, "#d9a77a");
  [[96, 0], [108, 1], [120, 2]].forEach(([y, s]) => {

// ---------- choosing and running steps ----------
function chooseActivity(k) {
  const entries = Object.entries(ACTS).map(([id, a]) => [id, Math.max(0, a.weight(k)) * (id === k.last ? 0.25 : 1)]);
  const total = entries.reduce((s, [, w]) => s + w, 0);
  let r = Math.random() * total;
  let id = "idle";
  for (const [i, w] of entries) { if ((r -= w) <= 0) { id = i; break; } }
  doActivity(k, id);
}
const THINK = { eat: "🍪", sleep: "💤", tv: "📺", read: "📖", paint: "🎨", flowers: "🌷", swing: "🌸", ball: "⚽", dance: "🎵", chat: "💬" };
function doActivity(k, id) {
  k.act = id; k.last = id;
  k.steps = ACTS[id].plan(k);
  k.step = null;
  k.seat = null;
  if (THINK[id] && Math.random() < 0.35 && !k.bubble.classList.contains("show")) say(k, THINK[id], 1200);
}
function startStep(k, s) {
  k.step = s;
  s.t = 0;
  if ("stay" in s) {
    s.dur = s.stay;
    k.pose = s.pose || "stand";
    k.item = s.item || null;
    k.seat = s.seat || null;
    if (s.face) k.dir = s.face;
    s.start?.call(s);
  }

}

}

function walkToward(k, tx, dt, speedMul = 1) {
  const dx = tx - k.x;
  k.dir = dx > 0 ? 1 : -1;
  k.x += k.dir * Math.min(Math.abs(dx), 28 * speedMul * dt);
  k.frameT += dt;
  if (k.frameT > 0.2 / speedMul) { k.frameT = 0; k.frame ^= 1; }
  return Math.abs(tx - k.x) < 0.5;
}

function updateKid(k, dt) {
  const n = k.needs;
  if (!k.asleep) { n.energy -= 0.012 * dt; n.hunger -= 0.02 * dt; n.fun -= 0.025 * dt; }
  else { n.hunger -= 0.006 * dt; }
  n.love -= 0.008 * dt;
  for (const key in n) n[key] = clamp(n[key], 3, 100);
  k.hop = Math.max(0, k.hop - dt * 4);

  if (k.held) { k.frameT += dt; if (k.frameT > 0.09) { k.frameT = 0; k.frame ^= 1; } return; }
  if (k.falling) {
    k.vy += 600 * dt;
    k.y += k.vy * dt;
    if (k.y >= FLOOR[k.f]) {
      k.y = FLOOR[k.f]; k.falling = false; k.frame = 0;
      say(k, pick(["oof!", "again again!", "hehe", "ta-da!"]), 1400);
      k.steps = []; startStep(k, { stay: 1.2, label: "landed!" });
    }
    return;
  }

  if (!k.step) {
    if (!k.steps.length) chooseActivity(k);
    startStep(k, k.steps.shift());
  }
  const s = k.step;

  if ("go" in s) {
    const t = s.go;
    k.pose = "stand";
    if (k.climbing) {
      const ty = FLOOR[k.climbing.to];
      k.y += Math.sign(ty - k.y) * 22 * dt;
      k.frameT += dt;
      if (k.frameT > 0.18) { k.frameT = 0; k.frame ^= 1; }
      if (Math.abs(ty - k.y) < 1) { k.y = ty; k.f = k.climbing.to; k.climbing = null; }
      return;
    }
    if (k.f !== t.f) {
      if (walkToward(k, LADDER, dt)) k.climbing = { to: t.f };
      return;
    }
    if (walkToward(k, clamp(t.x, ...RANGE[k.f]), dt)) { k.frame = 0; endStep(k); }
    return;
  }

  // staying somewhere and doing something
  s.t += dt;
  if (s.faceTo) k.dir = s.faceTo.x > k.x ? 1 : -1;
  s.tick?.call(s, dt);
  if (k.pose !== "free" && k.pose !== "dance") k.frame = 0;
  if (k.pose === "dance") { k.frameT += dt; if (k.frameT > 0.3) { k.frameT = 0; k.frame ^= 1; k.hop = 1; if (Math.random() < 0.3) k.dir *= -1; } }

}

// ---------- the ball, swing and everything else ----------
function kickBall(dir, power) { world.ball.vx = dir * power; world.ball.vh = rand(40, 80); }
function updateWorld(dt) {
  world.t += dt;
  const b = world.ball;
  b.x += b.vx * dt;
  b.vx *= Math.exp(-0.9 * dt);
  if (Math.abs(b.vx) < 2) b.vx = 0;
  if (b.x < 8) { b.x = 8; b.vx = Math.abs(b.vx) * 0.7; }
  if (b.x > 376) { b.x = 376; b.vx = -Math.abs(b.vx) * 0.7; }
  b.vh -= 260 * dt; b.h += b.vh * dt;
  if (b.h < 0) { b.h = 0; b.vh = Math.abs(b.vh) > 30 ? -b.vh * 0.45 : 0; }

  const sw = world.swing;
  const drive = world.swingDrive;
  world.swingDrive = false;
  sw.v += -6.7 * Math.sin(sw.a) * dt;
  if (drive) sw.v += Math.sign(sw.v || 1) * 0.9 * dt;   // she pumps her legs
  sw.v *= Math.exp(-(drive ? 0.12 : 0.7) * dt);
  sw.a = clamp(sw.a + sw.v * dt, -0.75, 0.75);

  world.fridgeT = Math.max(0, world.fridgeT - dt);
  world.flowers = world.flowers.map((f) => Math.max(0, f - dt / 21600)); // dry out over ~6h
  world.clouds.forEach((c) => { c.x += dt * 2 * c.s; if (c.x > W + 30) c.x = -40; });
  world.parts = world.parts.filter((p) => {
    p.life -= dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (p.type === "drop" || p.type === "crumb") { p.vy += 120 * dt; if (p.y > FLOOR[0]) return false; }
    return p.life > 0;
  });
}

function drawSky(sky) {

  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, 196);

    for (let i = 0; i < 46; i++) {
      const x = (i * 97) % W, y = (i * 41) % 120;
      const tw = Math.sin(world.t * 2 + i) > 0.6 ? 2 : 1;
      R(i % 5 ? "#fff" : "#fff1a8", x, y, 1, 1);

  }

  const h = hourNow();
  const day = h >= 6 && h < 20;

  const cx = 20 + p * (W - 40), cy = 70 - Math.sin(p * Math.PI) * 52;
  for (let y = -9; y <= 9; y++) for (let x = -9; x <= 9; x++) {
    const d = x * x + y * y;
    if (day) {
      if (d <= 36) R("#fff1a8", cx + x, cy + y, 1, 1);
      else if (d <= 49) R("#ffd966", cx + x, cy + y, 1, 1);
      else if (d <= 81 && (x === 0 || y === 0 || Math.abs(x) === Math.abs(y)) && Math.sin(world.t * 3) > -0.3) R("#ffe680", cx + x, cy + y, 1, 1);
    } else if (d <= 36 && (x + 3) * (x + 3) + (y - 2) * (y - 2) > 22) R("#fff8dc", cx + x, cy + y, 1, 1);
  }
  ctx.globalAlpha = 1 - sky.dark;
  world.clouds.forEach((c) => {
    const x = Math.round(c.x), y = c.y;
    R("#fff", x, y, 22, 5); R("#fff", x + 4, y - 3, 10, 3); R("#fff", x + 12, y - 5, 7, 5); R("#ffeef4", x, y + 4, 22, 1);
  });

}

function drawWindows(sky) {

const ITEMS = {

function kidPos(k) {
  if (k.pose === "swing" && k.step && "stay" in k.step) { const s = swingSeat(); return { x: s.x, y: s.y + 6 }; }
  let y = k.y;

function drawKid(k) {

function drawNight(sky) {

  ctx.save();

  ctx.rect(48, 58, 248, 138);
  ctx.fillStyle = `rgba(30,18,60,${sky.dark})`;

  ctx.fillStyle = `rgba(60,30,40,${sky.dark * 0.18})`;
  ctx.fillRect(48, 58, 248, 138);
  ctx.restore();
  // fairy lights glow
  const on = Math.min(1, sky.dark * 3);
  for (let x = 54; x < 206; x += 8) {
    const y = 60 + Math.round(Math.sin((x - 52) / 12) * 2 + 2) + 1;
    const c = ["#ffd966", "#ff9fbf", "#fff1a8", "#9db8ff"][(x / 8) % 4 | 0];

}

function drawParticles() {
  world.parts.forEach((p) => {
    ctx.globalAlpha = Math.min(1, p.life * 1.5);

    else if (p.type === "note") pixels(ctx, NOTE, x - 1, y - 2, { x: p.color });
    else if (p.type === "z") pixels(ctx, ZED, x - 1, y - 2, { x: p.color });
    else if (p.type === "drop") pixels(ctx, DROP, x - 1, y - 1, { x: p.color });

}

// ---------- fitting the house to the screen ----------
let scale = 2;
const stage = $("#stage"), wrap = $("#wrap");
function fit() {
  const availW = wrap.clientWidth;
  const availH = Math.max(240, innerHeight - (innerWidth > 640 ? 330 : 360));
  let s = Math.min(availW / W, availH / H);
  if (s < 1.4) s = Math.min(2.4, Math.max(s, availH / H));
  scale = s;
  stage.style.width = W * s + "px";
  stage.style.height = H * s + "px";
}
addEventListener("resize", fit);

wrap.scrollLeft = (W * scale - wrap.clientWidth) / 2;

function placeOverlays() {

    k.bubble.style.left = p.x * scale + "px";

// ---------- touching things ----------
const toScene = (e) => { const r = canvas.getBoundingClientRect(); return { x: (e.clientX - r.left) / (r.width / W), y: (e.clientY - r.top) / (r.height / H) }; };
function kidAt(p) {
  for (const k of [...KIDS].reverse()) {
    if (k.pose === "sleep") { const bx = BEDS[k.id]; if (p.x >= bx && p.x <= bx + 40 && p.y >= 94 && p.y <= 124) return k; continue; }
    const q = kidPos(k);
    if (Math.abs(p.x - q.x) < 13 && p.y < q.y + 2 && p.y > q.y - 32) return k;
  }
  return null;
}
const inRect = (p, x, y, w, h) => p.x >= x && p.x <= x + w && p.y >= y && p.y <= y + h;

function select(k) {
  selected = k;
  document.querySelectorAll(".kcard").forEach((c) => c.classList.toggle("sel", c.dataset.id === k?.id));
}

function interrupt(k, id) {
  if (k.held || k.falling) return;
  if (k.asleep && id !== "sleep") { endStep(k); }
  else endStep(k);
  k.climbing = null;
  if (k.y !== FLOOR[k.f]) { k.f = k.y < FLOOR[0] - 20 ? 1 : 0; k.y = FLOOR[k.f]; }
  doActivity(k, id);
}

function tapKid(k) {
  audio();
  select(k);
  if (k.asleep) {
    if (Math.random() < 0.6) { say(k, pick(SLEEP_TALK)); k.rolled = !k.rolled; tone(220, { type: "sine", slide: 160, dur: 0.35, vol: 0.06 }); }
    else { endStep(k); k.steps = []; sfx.boing(); }
    return;
  }
  sfx.squeak();
  k.hop = 1;
  k.needs.love = Math.min(100, k.needs.love + 8);
  hearts(k, 4);
  say(k, pick([...k.says, ...KID_SAYS]));
}

function tapWorld(p) {
  audio();
  if (inRect(p, 50, 150, 24, 46)) {                         // fridge: put out a snack
    world.fridgeT = 1.5; world.snack = true; sfx.fridge();
    const hungry = KIDS.filter((k) => !k.asleep && !k.held).sort((a, b) => a.needs.hunger - b.needs.hunger)[0];
    if (hungry) { interrupt(hungry, "eat"); say(hungry, "snack!!", 1200); }
    return true;
  }
  if (inRect(p, 234, 156, 26, 40)) {                        // tv
    world.tv = !world.tv; sfx.tv();
    if (world.tv) { const k = pick(KIDS.filter((k) => !k.asleep && !k.held && k.act !== "tv")); if (k) { interrupt(k, "tv"); say(k, "cartoons!", 1200); } }
    return true;
  }
  const b = world.ball;
  if (Math.abs(p.x - b.x) < 9 && p.y > FLOOR[0] - 14 - b.h && p.y < FLOOR[0] + 2) {   // ball
    kickBall(p.x < b.x ? 1 : -1, rand(120, 180)); sfx.kick();
    return true;
  }
  if (inRect(p, 2, 170, 44, 28)) {                          // flowers
    world.flowers = world.flowers.map((f) => Math.min(3, f + 0.8)); sfx.water();
    particle("drop", 24, 176, "#9db8ff", 8, 14);
    return true;
  }
  const s = swingSeat();
  if (inRect(p, s.x - 14, SWING.py, 28, s.y - SWING.py + 6)) { // swing: give it a push
    world.swing.v += (world.swing.v >= 0 ? 1 : -1) * 0.9; sfx.boing();
    return true;
  }
  for (const k of KIDS) {                                   // her own bed: bedtime
    const bx = BEDS[k.id];
    if (!k.asleep && inRect(p, bx, 94, 42, 30)) { interrupt(k, "sleep"); say(k, "okay mama…", 1400); sfx.lullaby(); return true; }
  }
  return false;
}

let drag = null, pan = null;
canvas.addEventListener("pointerdown", (e) => {
  const p = toScene(e);
  const k = kidAt(p);
  canvas.setPointerCapture(e.pointerId);
  if (!k) { pan = { p, sx: e.clientX, sl: wrap.scrollLeft, moved: false }; return; } // swipe the house sideways, or tap something
  drag = { k, sx: p.x, sy: p.y, moved: false };
});
canvas.addEventListener("pointermove", (e) => {
  if (pan) {
    const dx = e.clientX - pan.sx;
    if (Math.abs(dx) > 6) pan.moved = true;
    if (pan.moved) wrap.scrollLeft = pan.sl - dx;
    return;
  }
  if (!drag) return;
  const p = toScene(e);
  const k = drag.k;
  if (!drag.moved && Math.hypot(p.x - drag.sx, p.y - drag.sy) > 4) {
    drag.moved = true;
    audio(); sfx.squeak(); select(k);
    if (k.asleep) { endStep(k); say(k, "mmh? where are we going", 1400); }
    else { endStep(k); say(k, pick(["wheee!", "put me down papa!", "mama i'm flying", "hehe"]), 1400); }
    k.steps = []; k.climbing = null; k.held = true; k.pose = "stand"; k.act = "held"; k.label = "being carried by you ♡";
  }
  if (drag.moved) { k.x = clamp(p.x, 4, W - 4); k.y = clamp(p.y + 16, 30, FLOOR[0]); }
});
function drop(e) {
  if (pan) { const { p, moved } = pan; pan = null; if (!moved) tapWorld(p) || select(null); return; }
  if (!drag) return;
  const { k, moved } = drag;
  drag = null;
  if (!moved) return tapKid(k);
  k.held = false;
  const p = toScene(e);
  const bx = BEDS[k.id];
  if (inRect(p, bx - 4, 88, 48, 38)) {                     // into her bed
    k.x = bx + 20; k.f = 1; k.y = FLOOR[1];
    sfx.lullaby(); say(k, pick(GOODNIGHT));
    doActivity(k, "sleep"); k.steps = [sleepStep(k)];
    return;
  }
  for (const o of KIDS) if (o !== k && inRect(p, BEDS[o.id] - 4, 88, 48, 38)) say(k, "that's not my bed!");
  // fall onto whatever floor is underneath
  const upstairs = k.y <= FLOOR[1] + 4 && k.x >= RANGE[1][0] - 6 && k.x <= RANGE[1][1] + 4 && !(k.x > HOLE[0] && k.x < HOLE[1]);
  k.f = upstairs ? 1 : 0;
  if (k.f === 1) k.x = clamp(k.x, ...RANGE[1]);
  k.falling = true; k.vy = 0;
  k.act = "landing"; k.label = "falling!";
}
canvas.addEventListener("pointerup", drop);
canvas.addEventListener("pointercancel", drop);

// ---------- remembering everything ----------
function save() {
  store.set(SAVE_KEY, JSON.stringify({
    t: Date.now(),
    kids: Object.fromEntries(KIDS.map((k) => [k.id, { needs: k.needs, x: k.x, f: k.f, asleep: k.asleep }])),
    easel: world.easel, flowers: world.flowers, ball: world.ball.x,
  }));
}
// time passes while you're away: they get hungry, sleep, and so on
function catchUp(seconds) {
  const s = Math.min(seconds, 24 * 3600);
  KIDS.forEach((k) => {
    const n = k.needs;
    if (k.asleep) { n.energy = Math.min(100, n.energy + 0.25 * s); n.hunger -= 0.006 * s; }
    else { n.energy -= 0.012 * s; n.hunger -= 0.02 * s; n.fun -= 0.025 * s; }
    n.love -= 0.008 * s;
    for (const key in n) n[key] = clamp(n[key], 15, 100); // they look after each other while you're gone
  });
  world.flowers = world.flowers.map((f) => Math.max(0, f - s / 21600));
}
function load() {
  let saved = null;
  try { saved = JSON.parse(store.get(SAVE_KEY) || "null"); } catch {}
  if (saved) {
    KIDS.forEach((k) => {
      const d = saved.kids?.[k.id];
      if (!d) return;
      Object.assign(k.needs, d.needs);
      k.f = d.f === 1 ? 1 : 0; k.y = FLOOR[k.f];
      k.x = clamp(d.x, ...RANGE[k.f]);
    });
    if (Array.isArray(saved.easel) && saved.easel.length === EASEL_W * EASEL_H) world.easel = saved.easel;
    if (Array.isArray(saved.flowers)) world.flowers = saved.flowers;
    if (typeof saved.ball === "number") world.ball.x = saved.ball;
  }
  // anyone tucked in (here or on the main page) starts in bed
  KIDS.forEach((k) => {
    if (sleepLog[k.id]) { k.asleep = true; k.f = 1; k.x = BEDS[k.id] + 20; k.y = FLOOR[1]; k.act = "sleep"; startStep(k, sleepStep(k)); }
  });
  if (saved?.t) catchUp((Date.now() - saved.t) / 1000);
}
load();
setInterval(save, 8000);
addEventListener("pagehide", save);
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { hiddenAt = Date.now(); save(); }
  else if (hiddenAt) { catchUp((Date.now() - hiddenAt) / 1000); hiddenAt = 0; }
});

// ---------- go ----------
function tickClock() {
  const d = new Date();
  $("#clock").textContent = `${d.getHours() % 12 || 12}:${String(d.getMinutes()).padStart(2, "0")} ${d.getHours() < 12 ? "am" : "pm"} ${isNight() ? "🌙" : "☀️"}`;
}
tickClock(); setInterval(tickClock, 15000);
renderCards(); setInterval(renderCards, 500);

let last = performance.now();
function frame(now) {
  const dt = Math.min(now - last, 100) / 1000;
  last = now;
  updateWorld(dt);
  KIDS.forEach((k) => updateKid(k, dt));
  draw();
  placeOverlays();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
