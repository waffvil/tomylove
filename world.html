<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>our little island ♡</title>
<meta name="description" content="mivi, vimi and teddy's little island">
<meta name="theme-color" content="#ffb7d0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 56C10 40 4 28 12 18c6-7 15-6 20 2 5-8 14-9 20-2 8 10 2 22-20 38z' fill='%23ffb7d0' stroke='%236b3a55' stroke-width='5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Pixelify+Sans:wght@400;600&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ffb7d0;
    --pink-deep: #f48fb4;
    --pink-soft: #ffe1ec;
    --yellow: #fff1a8;
    --yellow-deep: #ffd966;
    --cream: #fffaf0;
    --ink: #6b3a55;
    --white: #ffffff;
    --pixel: "Pixelify Sans", ui-monospace, monospace;
    --bubble: "Bagel Fat One", "Nunito", system-ui, sans-serif;
    --body: "Nunito", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column;
    height: 100dvh;
    color: var(--ink);
    font-family: var(--body);
    background: #fff3c4;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,170,200,.38) 0 34px, transparent 34px 50px, rgba(255,255,255,.85) 50px 52px, transparent 52px 55px, rgba(255,255,255,.85) 55px 57px, transparent 57px 60px, rgba(255,255,255,.85) 60px 62px, transparent 62px 90px, rgba(255,205,90,.55) 90px 94px, transparent 94px 120px),
      repeating-linear-gradient(90deg, rgba(255,170,200,.38) 0 34px, transparent 34px 50px, rgba(255,255,255,.85) 50px 52px, transparent 52px 55px, rgba(255,255,255,.85) 55px 57px, transparent 57px 60px, rgba(255,255,255,.85) 60px 62px, transparent 62px 90px, rgba(255,205,90,.55) 90px 94px, transparent 94px 120px);
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
    gap: 8px;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }
  .top { display: flex; align-items: center; gap: 6px; flex: none; }
  .top h1 { flex: 1; margin: 0; min-width: 0; font: 400 clamp(18px, 4.6vw, 28px)/1 var(--bubble); color: var(--white);
    -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; text-shadow: 3px 3px 0 var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 4px 2px; }
  .pill {
    display: inline-flex; align-items: center; gap: 5px; flex: none;
    font: 600 14px/1 var(--pixel); color: var(--ink); text-decoration: none;
    background: var(--yellow); border: 2px solid var(--ink); border-radius: 999px;
    padding: 7px 11px; box-shadow: 2px 2px 0 var(--ink); cursor: pointer;
  }
  .pill.white { background: var(--white); }
  .pill.on { background: var(--pink); }
  .pill:active { transform: translate(2px,2px); box-shadow: none; }

  .win {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column;
    background: var(--cream);
    border: 3px solid var(--ink); border-radius: 14px;
    box-shadow: 5px 5px 0 var(--ink);
    overflow: hidden;
  }
  .titlebar {
    display: flex; align-items: center; gap: 8px; flex: none;
    padding: 5px 10px;
    background: linear-gradient(90deg, var(--pink) 0%, #ffd0de 55%, var(--yellow) 100%);
    border-bottom: 3px solid var(--ink);
    font: 600 13px/1.2 var(--pixel);
  }
  .titlebar .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .view { position: relative; flex: 1; min-height: 0; background: #9fd6f0; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  .view canvas { position: absolute; image-rendering: pixelated; cursor: pointer; }
  .overlay { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .bubble {
    position: absolute; transform: translate(-50%, -100%) scale(.8);
    white-space: nowrap;
    background: var(--white); border: 2px solid var(--ink); border-radius: 12px;
    padding: 4px 8px;
    font: 800 13px/1.2 var(--body); color: var(--ink);
    box-shadow: 2px 2px 0 var(--ink);
    opacity: 0; transition: opacity .15s, transform .15s;
  }
  .bubble.show { opacity: 1; transform: translate(-50%, -100%) scale(1); }
  .tag {
    position: absolute; transform: translate(-50%, 0);
    font: 600 11px/1 var(--pixel); color: var(--ink);
    background: var(--yellow); border: 2px solid var(--ink); border-radius: 999px;
    padding: 2px 6px; white-space: nowrap; opacity: 0; transition: opacity .2s;
  }
  .tag.show { opacity: 1; }
  .toast {
    position: absolute; left: 50%; bottom: 10px; transform: translate(-50%, 10px);
    background: var(--ink); color: var(--yellow);
    font: 600 13px/1.3 var(--pixel); padding: 8px 14px; border-radius: 999px;
    opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none;
    max-width: calc(100% - 24px); text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .dock { display: flex; gap: 6px; padding: 6px; border-top: 3px solid var(--ink); background: var(--pink-soft); flex: none; overflow-x: auto; scrollbar-width: none; }
  .chip {
    display: flex; align-items: center; gap: 6px; flex: 1 1 0; min-width: 118px;
    background: var(--white); border: 2px solid var(--ink); border-radius: 12px;
    box-shadow: 2px 2px 0 var(--ink); padding: 4px 8px 4px 4px; cursor: pointer; text-align: left;
    font: inherit; color: inherit;
  }
  .chip.sel { background: #fff6c9; }
  .chip canvas { width: 32px; height: 34px; image-rendering: pixelated; flex: none; }
  .chip .txt { min-width: 0; flex: 1; }
  .chip b { display: block; font: 400 16px/1 var(--bubble); }
  .chip small { display: block; font: 600 11px/1.2 var(--pixel); opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip .mood { font-size: 18px; }
  .tools { display: flex; gap: 6px; flex: none; }
  @media (max-width: 560px) {
    .chip { min-width: 0; padding-right: 4px; }
    .chip small, .chip .mood { display: none; }
    .chip b { font-size: 13px; }
    .tools .pill { padding: 6px 7px; }
  }
  .tools .pill { padding: 6px 9px; font-size: 15px; }
</style>
</head>
<body>

<div class="top">
  <a class="pill" href="./">← back</a>
  <h1>our little island</h1>
  <span class="pill white" id="gifts" title="presents from the girls">🌸 0</span>
  <button class="pill white" type="button" id="soundBtn">🔊</button>
</div>

<div class="win">
  <div class="titlebar"><span>🌴</span><span class="name">island.exe — mivi, vimi &amp; teddy</span><span id="clock"></span></div>
  <div class="view" id="view">
    <canvas id="scene"></canvas>
    <div class="overlay" id="overlay"></div>
    <div class="toast" id="toast"></div>
  </div>
  <div class="dock" id="dock">
    <div class="tools">
      <button class="pill on" type="button" id="autoBtn" title="follow whoever is doing something fun">🎥</button>
      <button class="pill" type="button" id="mapBtn" title="see the whole island">🗺️</button>
      <button class="pill" type="button" id="snackBtn" title="put snacks on the picnic blanket">🧺</button>
    </div>
  </div>
</div>

<script src="kids.js"></script>
<script>
// ======================================================================
// our little island: the girls roam a top-down map (old pokémon style),
// choose what to do by themselves, follow the real clock, and remember it all.
// ======================================================================

const $ = (s) => document.querySelector(s);
const store = {
  get(k) { try { return localStorage.getItem("tomylove." + k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem("tomylove." + k, v); } catch {} },
};
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const irand = (a, b) => Math.floor(rand(a, b + 1));

// ---------- sounds (only when you touch things) ----------
let ac = null;
let muted = store.get("muted") === "1";
function audio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; } }
  if (ac.state === "suspended") ac.resume();
  return ac;
}
function tone(freq, { type = "triangle", dur = 0.15, vol = 0.12, at = 0, slide = null } = {}) {
  if (muted || !ac) return;
  const t = ac.currentTime + at;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(ac.destination);
  o.start(t); o.stop(t + dur + 0.03);
}
const sfx = {
  squeak() { tone(1250, { type: "sine", slide: 1750, dur: 0.09, vol: 0.12 }); tone(1500, { type: "sine", slide: 2100, dur: 0.1, vol: 0.1, at: 0.11 }); },
  pop()    { tone(500, { type: "sine", slide: 1100, dur: 0.09, vol: 0.14 }); },
  boing()  { tone(180, { slide: 520, dur: 0.22, vol: 0.12 }); },
  splash() { [700, 500, 900].forEach((f, i) => tone(f, { type: "sine", slide: f * 0.5, dur: 0.12, vol: 0.06, at: i * 0.05 })); },
  rustle() { tone(2600, { type: "square", slide: 1800, dur: 0.05, vol: 0.02 }); tone(2200, { type: "square", slide: 1500, dur: 0.05, vol: 0.02, at: 0.06 }); },
  gift()   { [784, 988, 1175, 1568].forEach((f, i) => tone(f, { type: "triangle", dur: 0.3, vol: 0.09, at: i * 0.07 })); },
  knock()  { tone(140, { type: "sine", dur: 0.08, vol: 0.25 }); tone(140, { type: "sine", dur: 0.08, vol: 0.25, at: 0.16 }); },
  quack()  { tone(600, { type: "sawtooth", slide: 380, dur: 0.12, vol: 0.05 }); },
  lullaby() { [523.25, 523.25, 783.99, 783.99, 880, 880, 783.99].forEach((f, i) => tone(f, { type: "sine", dur: 0.55, vol: 0.07, at: i * 0.3 })); },
};
document.addEventListener("pointerdown", audio, { capture: true });
function renderSound() { $("#soundBtn").textContent = muted ? "🔈" : "🔊"; }
$("#soundBtn").addEventListener("click", () => { muted = !muted; store.set("muted", muted ? "1" : "0"); renderSound(); audio(); sfx.pop(); });
renderSound();

let toastTimer;
function toast(msg, ms = 2600) {
  const t = $("#toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), ms);
}

// ---------- the map ----------
const T = 16, MW = 44, MH = 32, WW = MW * T, WH = MH * T;
const GRASS = 0, PATH = 1, SAND = 2, WATER = 3, FLOWERS = 4, TALL = 5;
const INK = "#4a2b3a";
const tiles = new Uint8Array(MW * MH);
const solid = new Uint8Array(MW * MH);
const inside = (x, y) => x >= 0 && y >= 0 && x < MW && y < MH;
const tileAt = (x, y) => (inside(x, y) ? tiles[y * MW + x] : WATER);
const setTile = (x, y, v) => { if (inside(x, y)) tiles[y * MW + x] = v; };
const block = (x, y) => { if (inside(x, y)) solid[y * MW + x] = 1; };
const walkable = (x, y) => inside(x, y) && tiles[y * MW + x] !== WATER && !solid[y * MW + x];
const tileOf = (px, py) => [Math.floor(px / T), Math.floor(py / T)];
const feetOf = (tx, ty) => [tx * T + 8, ty * T + 12];

function ellipse(cx, cy, rx, ry, v) {
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) if (((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 <= 1) setTile(x, y, v);
}
const hPath = (y, x0, x1) => { for (let x = x0; x <= x1; x++) { setTile(x, y, PATH); setTile(x, y + 1, PATH); } };
const vPath = (x, y0, y1) => { for (let y = y0; y <= y1; y++) { setTile(x, y, PATH); setTile(x + 1, y, PATH); } };

// beach and sea along the bottom
for (let x = 0; x < MW; x++) {
  const sandTop = 24 + Math.round(Math.sin(x / 5) * 0.7);
  const shore = 27 + Math.round(Math.sin(x / 6 + 1) * 0.8);
  for (let y = sandTop; y < MH; y++) setTile(x, y, y >= shore ? WATER : SAND);
}
ellipse(34, 8, 4.6, 3.1, WATER);          // the pond
ellipse(8, 7, 4.6, 3.1, FLOWERS);         // flower field
ellipse(15.5, 20.5, 2.8, 2.2, TALL);      // tall grass patches
ellipse(37.5, 19, 2.8, 2.3, TALL);
hPath(14, 3, 40);                         // main path
vPath(20, 9, 24);                         // from the front door down to the beach
hPath(10, 12, 19);                        // to the flowers
hPath(10, 22, 29);                        // to the pond
vPath(9, 16, 17);                         // to the playground
vPath(28, 16, 16);                        // to the picnic
for (let y = 21; y <= 23; y++) for (let x = 5; x <= 8; x++) setTile(x, y, SAND); // sandbox

// things standing on the map
const objs = [];
function add(o) { objs.push(o); (o.solid || []).forEach(([x, y]) => block(o.tx + x, o.ty + y)); return o; }
function tree(tx, ty, kind) { if (tileAt(tx, ty + 1) === WATER || tileAt(tx + 1, ty + 1) === WATER) return; add({ type: "tree", kind, tx, ty, base: (ty + 2) * T, solid: [[0, 1], [1, 1]] }); }
for (let x = 0; x < MW; x += 2) tree(x, 0, (x / 2) % 3 === 1 ? "cherry" : "green");
for (let y = 2; y < 23; y += 2) { tree(0, y, y % 6 === 2 ? "cherry" : "green"); tree(42, y, y % 6 === 4 ? "cherry" : "green"); }
[[14, 3, "cherry"], [25, 3, "cherry"], [30, 15, "cherry"], [3, 15, "cherry"], [36, 11, "green"], [24, 19, "green"],
 [33, 21, "cherry"], [12, 22, "green"], [2, 10, "green"], [39, 5, "green"], [14, 7, "green"], [11, 2, "green"]].forEach(([x, y, k]) => tree(x, y, k));
const HOUSE = add({ type: "house", tx: 17, ty: 3, base: 9 * T, solid: [...Array(7)].flatMap((_, x) => [1, 2, 3, 4, 5].map((y) => [x, y])) });
const DOOR = [20, 9];                     // the tile in front of the door
add({ type: "mailbox", tx: 23, ty: 9, base: 10 * T, solid: [[0, 0]] });
add({ type: "sign", tx: 18, ty: 9, base: 10 * T, solid: [[0, 0]] });
const SWING = add({ type: "swing", tx: 5, ty: 17, base: 19 * T - 2, solid: [[0, 1], [2, 1]] });
const SWING_SEAT = [6, 18];
const SLIDE = add({ type: "slide", tx: 10, ty: 17, base: 20 * T, solid: [[0, 1], [1, 1], [0, 2], [1, 2]] });
add({ type: "basket", tx: 30, ty: 17, base: 18 * T, solid: [[0, 0]] });
add({ type: "bench", tx: 15, ty: 16, base: 16 * T });
[[31, 12], [38, 12], [3, 26], [39, 25], [25, 8]].forEach(([x, y]) => { if (walkable(x, y)) add({ type: "rock", tx: x, ty: y, base: (y + 1) * T - 2, solid: [[0, 0]] }); });
[[19, 13], [24, 13], [27, 16], [19, 22]].forEach(([x, y]) => { if (walkable(x, y)) add({ type: "lamp", tx: x, ty: y, base: (y + 1) * T - 1, solid: [[0, 0]] }); });
const CASTLE = { tx: 6, ty: 22, level: 0 };
add({ type: "castle", tx: 6, ty: 22, base: 23 * T - 3 });
const PICNIC = { x0: 26, y0: 17, x1: 29, y1: 18 };
const SIGN_TEXT = "welcome to mivi, vimi & teddy's island ♡";

// handy places
const allTiles = (fn) => { const out = []; for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) if (fn(x, y)) out.push([x, y]); return out; };
const near = (x, y, type) => [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => tileAt(x + dx, y + dy) === type);
const SPOTS = {
  pond: allTiles((x, y) => y < 14 && x > 27 && walkable(x, y) && near(x, y, WATER)),
  shore: allTiles((x, y) => y > 22 && walkable(x, y) && near(x, y, WATER)),
  flowers: allTiles((x, y) => tileAt(x, y) === FLOWERS && walkable(x, y)),
  sand: allTiles((x, y) => y > 22 && tileAt(x, y) === SAND && walkable(x, y) && !near(x, y, WATER)),
  shade: objs.filter((o) => o.type === "tree").map((o) => [o.tx + (o.tx > 20 ? 0 : 1), o.ty + 2]).filter(([x, y]) => walkable(x, y)),
  picnic: [[26, 17], [27, 18], [28, 17], [29, 18]],
  bench: [[15, 16], [16, 16]],
  sandbox: [[5, 22], [7, 22], [6, 23]],
};
const facing = (x, y, type) => { for (const [dx, dy, d] of [[1, 0, "right"], [-1, 0, "left"], [0, 1, "down"], [0, -1, "up"]]) if (tileAt(x + dx, y + dy) === type) return d; return "down"; };

// pond decorations, shells on the beach
const lilies = allTiles((x, y) => tileAt(x, y) === WATER && y < 14 && (hash(x, y) % 4 === 0));
let shells = SPOTS.sand.filter(([x, y]) => hash(x * 3, y * 7) % 7 === 0).map(([x, y]) => ({ x: x * T + 4 + (hash(x, y) % 8), y: y * T + 6 + (hash(y, x) % 6), kind: hash(x, y) % 3 }));

// ---------- pathfinding (A*, four directions) ----------
function findPath(sx, sy, tx, ty) {
  if (!walkable(tx, ty)) return null;
  const key = (x, y) => y * MW + x;
  const open = [[sx, sy]], came = new Map(), g = new Map([[key(sx, sy), 0]]);
  const f = new Map([[key(sx, sy), Math.abs(tx - sx) + Math.abs(ty - sy)]]);
  let guard = 0;
  while (open.length && guard++ < 4000) {
    let bi = 0;
    for (let i = 1; i < open.length; i++) if (f.get(key(...open[i])) < f.get(key(...open[bi]))) bi = i;
    const [x, y] = open.splice(bi, 1)[0];
    if (x === tx && y === ty) {
      const path = [[x, y]];
      let k = key(x, y);
      while (came.has(k)) { k = came.get(k); path.unshift([k % MW, Math.floor(k / MW)]); }
      return path.slice(1);
    }
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + dx, ny = y + dy;
      if (!walkable(nx, ny)) continue;
      const ng = g.get(key(x, y)) + 1 + (tileAt(nx, ny) === PATH ? 0 : 0.3); // they like paths
      if (ng < (g.get(key(nx, ny)) ?? Infinity)) {
        came.set(key(nx, ny), key(x, y));
        g.set(key(nx, ny), ng);
        f.set(key(nx, ny), ng + Math.abs(tx - nx) + Math.abs(ty - ny));
        if (!open.some(([ox, oy]) => ox === nx && oy === ny)) open.push([nx, ny]);
      }
    }
  }
  return null;
}
function nearestWalkable(tx, ty) {
  for (let r = 0; r < 12; r++) for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
    if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
    if (walkable(tx + dx, ty + dy)) return [tx + dx, ty + dy];
  }
  return DOOR;
}
const randomTile = (minDist = 0, from = null) => {
  for (let i = 0; i < 60; i++) {
    const x = irand(1, MW - 2), y = irand(2, MH - 3);
    if (walkable(x, y) && (!from || Math.abs(x - from[0]) + Math.abs(y - from[1]) >= minDist)) return [x, y];
  }
  return DOOR;
};

// ---------- drawing helpers ----------
function R(g, c, x, y, w, h) { g.fillStyle = c; g.fillRect(x, y, w, h); }
function box(g, x, y, w, h, fill) { R(g, INK, x, y, w, h); R(g, fill, x + 1, y + 1, w - 2, h - 2); }
function disc(g, cx, cy, r, fill, outline = INK) {
  for (let y = -r - 1; y <= r + 1; y++) for (let x = -r - 1; x <= r + 1; x++) {
    const d = x * x + y * y;
    if (d <= r * r) R(g, fill, cx + x, cy + y, 1, 1);
    else if (outline && d <= (r + 1) * (r + 1)) R(g, outline, cx + x, cy + y, 1, 1);
  }
}
function pixels(g, rows, x, y, colors) { rows.forEach((row, j) => [...row].forEach((ch, i) => { if (ch !== "." && colors[ch]) R(g, colors[ch], x + i, y + j, 1, 1); })); }
const canvasOf = (w, h, fn) => { const c = document.createElement("canvas"); c.width = w; c.height = h; const g = c.getContext("2d"); fn(g); return c; };
const HEART = [".x.x.", "xxxxx", ".xxx.", "..x.."];

// ---------- ground (drawn once) ----------
const ground = canvasOf(WW, WH, (g) => {
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    const t = tileAt(x, y), px = x * T, py = y * T, h = hash(x, y);
    if (t === WATER) {
      const sea = y > 20;
      R(g, sea ? "#9fd6f0" : "#a9dcf3", px, py, T, T);
      if ((x + y) % 2 === 0) R(g, sea ? "#94cdea" : "#9fd3ec", px + 2, py + 3, 5, 1);
    } else if (t === SAND) {
      R(g, "#fcebc2", px, py, T, T);
      for (let i = 0; i < 4; i++) R(g, "#f0d9a6", px + ((h >> (i * 3)) % 15), py + ((h >> (i * 4 + 1)) % 15), 1, 1);
    } else if (t === PATH) {
      R(g, "#f4dfba", px, py, T, T);
      for (let i = 0; i < 3; i++) R(g, "#e6c99c", px + 2 + ((h >> (i * 5)) % 12), py + 2 + ((h >> (i * 3 + 2)) % 12), 2, 1);

function hourNow() { const d = new Date(); return d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600; }
const isNight = () => { const h = hourNow(); return h >= 22 || h < 7; };
const TINT = [[0, "#1c1240", 0.52], [5, "#2a1e50", 0.46], [6.5, "#ff9ab0", 0.16], [8, "#ffffff", 0], [17, "#ffffff", 0],
  [18.7, "#ff9a5a", 0.16], [19.8, "#d0507a", 0.24], [21, "#2a1e55", 0.44], [24, "#1c1240", 0.52]];
const hex = (c) => [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16));
function tintNow() {
  const h = hourNow();
  for (let i = 0; i < TINT.length - 1; i++) {
    const [h0, c0, a0] = TINT[i], [h1, c1, a1] = TINT[i + 1];
    if (h >= h0 && h < h1) {
      const t = (h - h0) / (h1 - h0), A = hex(c0), B = hex(c1);
      return { rgb: A.map((v, j) => Math.round(v + (B[j] - v) * t)), a: a0 + (a1 - a0) * t };
    }
  }
  return { rgb: hex(TINT[0][1]), a: TINT[0][2] };
}

function faceTo(k, x, y) { const dx = x - k.x, dy = y - k.y; k.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"); }

// walking along a path of tiles
function setPath(k, tx, ty) {
  const [sx, sy] = tileOfKid(k);
  const p = findPath(sx, sy, tx, ty);
  k.path = (p || []).map(([x, y]) => feetOf(x, y));
  if (p && !p.length) k.path = [feetOf(tx, ty)];
  return !!p;
}
function walk(k, dt, speed = k.speed) {
  if (!k.path.length) return true;
  const [tx, ty] = k.path[0];
  const dx = tx - k.x, dy = ty - k.y, d = Math.hypot(dx, dy);
  if (d < 0.6) { k.x = tx; k.y = ty; k.path.shift(); return !k.path.length; }
  faceTo(k, tx, ty);
  const s = Math.min(d, speed * dt);
  k.x += (dx / d) * s; k.y += (dy / d) * s;
  k.dist += s;
  if (k.dist > 7) { k.dist = 0; k.frame ^= 1; if (tileAt(...tileOfKid(k)) === TALL && Math.random() < 0.5) { particle("leaf", k.x, k.y - 6, "#7fbe68", 2, 4, -18); } }
  return false;
}

// ---------- choosing and running ----------
const THINK = { flowers: "🌷", butterfly: "🦋", pond: "🦆", swing: "🎀", slide: "🛝", sandcastle: "🏰", beach: "🌊", shells: "🐚", picnic: "🍓", nap: "💤", chat: "💬", tag: "🏃‍♀️", home: "🏠" };
function chooseActivity(k) {
  const entries = Object.entries(ACTS).map(([id, a]) => [id, Math.max(0, a.w(k)) * (id === k.last ? 0.25 : 1)]);
  let r = Math.random() * entries.reduce((s, [, w]) => s + w, 0), id = "idle";
  for (const [i, w] of entries) { if ((r -= w) <= 0) { id = i; break; } }
  doActivity(k, id);
}
function doActivity(k, id) {
  k.act = id; k.last = id;
  k.path = [];
  k.steps = ACTS[id].plan(k);
  k.step = null;
  if (THINK[id] && Math.random() < 0.35 && !k.bubble.classList.contains("show")) say(k, THINK[id], 1200);
}
function startStep(k, s) {
  k.step = s;
  s.t = 0;
  k.pose = s.pose || "stand";
  k.item = s.item || null;
  if (s.face) k.dir = s.face;
  if ("go" in s) setPath(k, ...s.go);
  if ("stay" in s) s.dur = s.stay;
  s.start?.call(s, s);
  k.label = s.label || k.label;
}
function endStep(k) {
  const s = k.step;
  k.step = null;
  if (!s) return;
  s.end?.call(s, s);
  k.item = null;
  k.pose = "stand";
}
function interrupt(k, id) {
  if (k.held) return;
  if (k.home) leaveHome(k);
  endStep(k);
  doActivity(k, id);
}

function updateKid(k, dt) {
  const n = k.needs;
  if (!k.asleep) { n.energy -= 0.012 * dt; n.hunger -= 0.02 * dt; n.fun -= 0.025 * dt; } else n.hunger -= 0.006 * dt;
  n.love -= 0.008 * dt;
  for (const key in n) n[key] = clamp(n[key], 3, 100);
  k.hop = Math.max(0, k.hop - dt * 4);
  if (k.held) { k.dist += dt; if (k.dist > 0.09) { k.dist = 0; k.frame ^= 1; } return; }
  if (k.lift > 0) { k.lift = Math.max(0, k.lift - dt * 60); }

  if (!k.step) {
    if (!k.steps.length) chooseActivity(k);
    startStep(k, k.steps.shift());
  }
  const s = k.step;
  s.t += dt;
  if ("go" in s) {
    if (walk(k, dt)) { k.frame = 0; endStep(k); }
    return;
  }
  if (s.run) { if (s.run.call(s, dt, s)) { k.frame = 0; endStep(k); } return; }
  if (s.faceKid) faceTo(k, s.faceKid.x, s.faceKid.y);
  s.tick?.call(s, dt, s);
  k.frame = 0;
  if (s.t >= s.dur) endStep(k);
}

function updateWorld(dt) {
  world.t += dt;
  const night = isNight();
  butterflies.forEach((b) => {
    b.a += dt * rand(0.5, 1.5);
    b.vx += Math.cos(b.a) * 40 * dt; b.vy += Math.sin(b.a * 1.3) * 40 * dt;
    b.vx *= 0.97; b.vy *= 0.97;
    b.x = clamp(b.x + b.vx * dt, 40, WW - 40); b.y = clamp(b.y + b.vy * dt, 40, 370);
  });
  fireflies.forEach((f) => { f.a += dt; f.x += Math.cos(f.a * 0.7) * 6 * dt; f.y += Math.sin(f.a * 0.9) * 5 * dt; });
  ducks.forEach((d) => {
    d.x += d.vx * dt; d.y += d.vy * dt;
    const [tx, ty] = tileOf(d.x, d.y);
    if (tileAt(tx, ty) !== WATER || tileAt(...tileOf(d.x + Math.sign(d.vx) * 8, d.y)) !== WATER) { d.vx = -d.vx; d.x += d.vx * dt * 2; }
    if (tileAt(...tileOf(d.x, d.y + Math.sign(d.vy) * 6)) !== WATER) { d.vy = -d.vy; d.y += d.vy * dt * 2; }
    if (Math.random() < dt * 0.1) { d.vx = rand(-7, 7); d.vy = rand(-3, 3); }
  });
  if (Math.random() < dt * 0.25) { const [x, y] = pick(pondTiles); particle("splash", x * T + 8, y * T + 8, "#e8f7ff", 5, 3, -18); }
  if (!night && Math.random() < dt * 1.2) { const o = pick(objs.filter((o) => o.type === "tree" && o.kind === "cherry")); particle("petal", o.tx * T + rand(4, 28), o.ty * T + rand(0, 16), pick(["#ffb7d0", "#fff", "#ff9fbf"]), 1, 2, 6); }
  objs.forEach((o) => { if (o.shake) o.shake = Math.max(0, o.shake - dt * 3); });
  world.parts = world.parts.filter((p) => {
    p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.type === "petal") { p.vx += Math.sin(world.t * 3 + p.y) * 10 * dt; p.vy = Math.min(p.vy + 10 * dt, 14); }
    else if (p.type !== "heart" && p.type !== "z" && p.type !== "note") p.vy += 90 * dt;
    return p.life > 0;
  });
}

  ctx.drawImage(ground, 0, 0);
  drawSea();
  // everything that stands up, sorted so things in front cover things behind
  const list = objs.map((o) => ({ y: o.base, fn: () => DRAW_OBJ[o.type](ctx, o) }));
  KIDS.forEach((k) => list.push({ y: k.y + (k.pose === "swing" ? 4 : 0) + (k.held ? 100 : 0), fn: () => kidDraw(k) }));
  list.sort((a, b) => a.y - b.y).forEach((d) => d.fn());
  drawCritters(night);
  drawParticles();
  drawNight(tint, night);
  // a little marker over whoever you picked
  if (selected && !selected.home) {
    const bob = Math.round(Math.sin(world.t * 5));
    pixels(ctx, ["xxxxx", ".xxx.", "..x.."], Math.round(selected.x) - 2, Math.round(selected.y) - 44 + bob - Math.round(selected.lift), { x: "#ffd966" });
  }
}

// ---------- fitting to the screen + the camera ----------
function fit() {
  const w = view.clientWidth, h = view.clientHeight;
  if (mapMode) {
    const s = Math.min(w / WW, h / WH);
    canvas.width = WW; canvas.height = WH;
    Object.assign(canvas.style, { width: WW * s + "px", height: WH * s + "px", left: (w - WW * s) / 2 + "px", top: (h - WH * s) / 2 + "px" });
    scale = s;
  } else {
    scale = clamp(Math.round(w / 380), 2, 4);
    canvas.width = Math.ceil(w / scale); canvas.height = Math.ceil(h / scale);
    Object.assign(canvas.style, { width: canvas.width * scale + "px", height: canvas.height * scale + "px", left: "0px", top: "0px" });
  }
  ctx.imageSmoothingEnabled = false;
}
addEventListener("resize", fit);
fit();

function camTarget() {
  if (cam.mode === "free") return null;
  const k = cam.target;
  if (!k) return null;
  if (k.home) return [HOUSE.tx * T + 56, HOUSE.ty * T + 70];
  return [k.x, k.y - 16];
}
function updateCamera(dt) {
  if (mapMode) { cam.x = 0; cam.y = 0; return; }
  if (cam.mode === "auto") {
    cam.switchT -= dt;
    if (!cam.target || cam.switchT <= 0) {
      const out = KIDS.filter((k) => !k.home);
      const fun = out.filter((k) => !["idle", "explore", "bench", "sign"].includes(k.act));
      cam.target = pick(fun.length ? fun : out.length ? out : KIDS);
      cam.switchT = rand(22, 35);
    }
  }
  const t = camTarget();
  if (t) {
    const tx = t[0] - canvas.width / 2, ty = t[1] - canvas.height / 2;
    const e = 1 - Math.exp(-dt * 3);
    cam.x += (tx - cam.x) * e; cam.y += (ty - cam.y) * e;
  }
  cam.x = clamp(cam.x, 0, Math.max(0, WW - canvas.width));
  cam.y = clamp(cam.y, 0, Math.max(0, WH - canvas.height));
  if (canvas.width > WW) cam.x = (WW - canvas.width) / 2;
  if (canvas.height > WH) cam.y = (WH - canvas.height) / 2;
}
function setCamMode(mode, target = null) {
  cam.mode = mode;
  if (target) cam.target = target;
  if (mode === "auto") cam.switchT = 0;
  $("#autoBtn").classList.toggle("on", mode === "auto");
}

function placeOverlays() {
  const r = canvas.getBoundingClientRect(), v = view.getBoundingClientRect();
  const sx = r.width / canvas.width;
  KIDS.forEach((k) => {
    const hidden = k.home;
    const px = (k.home ? HOUSE.tx * T + 56 : k.x) - cam.x, py = (k.home ? HOUSE.ty * T + 60 : k.y - 34 - k.lift) - cam.y;
    k.bubble.style.left = r.left - v.left + px * sx + "px";
    k.bubble.style.top = r.top - v.top + py * sx + "px";
    k.tag.style.left = r.left - v.left + (k.x - cam.x) * sx + "px";
    k.tag.style.top = r.top - v.top + (k.y + 3 - cam.y) * sx + "px";
    k.tag.classList.toggle("show", !hidden && (k === selected || mapMode));
  });
}

// ---------- touching things ----------
const toWorld = (e) => { const r = canvas.getBoundingClientRect(); return { x: cam.x + (e.clientX - r.left) / (r.width / canvas.width), y: cam.y + (e.clientY - r.top) / (r.height / canvas.height) }; };
function kidAt(p) {
  const hits = KIDS.filter((k) => !k.home && Math.abs(p.x - k.x) < 12 && p.y < k.y + 3 && p.y > k.y - 30 - k.lift);
  return hits.sort((a, b) => b.y - a.y)[0] || null;
}
function select(k) {
  selected = k;
  document.querySelectorAll(".chip").forEach((c) => c.classList.toggle("sel", c.dataset.id === k?.id));
  if (k) setCamMode("follow", k);
}

function tapKid(k) {
  audio(); select(k);
  if (k.gift) {
    gifts++; store.set("gifts", String(gifts)); renderGifts();
    sfx.gift(); hearts(k, 8);
    say(k, k.gift === "shell" ? pick(["a seashell for you mama ♡", "for papa! listen, the sea"]) : pick(["this flower is for you mama ♡", "for papa ♡ hehe", "i picked it myself!"]), 2400);
    particle("petal", k.x, k.y - 20, "#f48fb4", 8, 8, -20);
    k.gift = null;
    return;
  }
  sfx.squeak(); k.hop = 1;
  k.needs.love = Math.min(100, k.needs.love + 8);
  hearts(k, 4);
  say(k, pick([...k.says, ...KID_SAYS]));
}

let knocks = 0;
function tapWorld(p) {
  audio();
  const [tx, ty] = tileOf(p.x, p.y);
  // the house: knock knock
  if (p.x > HOUSE.tx * T + 6 && p.x < HOUSE.tx * T + 106 && p.y > HOUSE.ty * T && p.y < HOUSE.ty * T + 96) {
    sfx.knock();
    const home = KIDS.filter((k) => k.home);
    if (!home.length) { toast("knock knock… nobody's home, they're out playing ♡"); return true; }
    if (isNight() && ++knocks < 3) { toast(pick(["shhh… they're sleeping 💤", "zzz… (try not to wake them)"])); return true; }
    knocks = 0;
    const k = pick(home);
    k.needs.energy = Math.max(k.needs.energy, isNight() ? 60 : 100);
    if (k.step) k.step.dur = 0; else leaveHome(k);
    if (isNight()) setTimeout(() => say(k, "mama i can't sleep…", 2000), 300);
    select(k);
    return true;
  }
  // trees: give them a shake
  const t = objs.find((o) => o.type === "tree" && p.x > o.tx * T && p.x < o.tx * T + 32 && p.y > o.ty * T - 12 && p.y < (o.ty + 2) * T);
  if (t) {
    t.shake = 1.5; sfx.rustle();
    for (let i = 0; i < 10; i++) particle(t.kind === "cherry" ? "petal" : "leaf", t.tx * T + rand(2, 30), t.ty * T + rand(-8, 12), t.kind === "cherry" ? pick(["#ffb7d0", "#fff", "#ff9fbf"]) : pick(["#8fd17a", "#b5e6a0"]), 1, 2, 4);
    return true;
  }
  const o = objs.find((o) => o.solid && o.solid.some(([dx, dy]) => o.tx + dx === tx && o.ty + dy === ty));
  if (o?.type === "mailbox") { sfx.pop(); toast(pick(LETTERS), 3600); return true; }
  if (o?.type === "sign") { sfx.pop(); toast(SIGN_TEXT); return true; }
  if (o?.type === "basket") { snacks(); return true; }
  if (o?.type === "swing" || (tx === SWING_SEAT[0] && ty === SWING_SEAT[1])) {
    const k = KIDS.find((k) => k.pose === "swing");
    if (k) { say(k, "higher papa!!", 1200); k.hop = 1; sfx.boing(); return true; }
  }
  if (tileAt(tx, ty) === WATER) {
    sfx.splash(); particle("splash", p.x, p.y, "#e8f7ff", 8, 4, -24);
    const d = ducks.find((d) => Math.hypot(d.x - p.x, d.y - p.y) < 14);
    if (d) { sfx.quack(); d.vx = -d.vx * 2; }
    return true;
  }
  if (tileAt(tx, ty) === TALL) { sfx.rustle(); particle("leaf", p.x, p.y, "#7fbe68", 6, 6, -24); }
  // with a girl picked: call her over
  if (selected && !selected.home && walkable(tx, ty)) {
    const k = selected;
    endStep(k); k.act = "called"; k.steps = [
      { go: [tx, ty], label: "coming to you!" },
      { stay: 3, label: "waiting for you ♡", face: "down", start() { k.hop = 1; } },
    ];
    say(k, pick(["coming!", "okay mama!", "đợi con!", "on my way!"]), 1200);
    particle("heart", p.x, p.y, "#ffd966", 2, 2);
    return true;
  }
  return false;
}
const LETTERS = ["a letter: “papa loves mama the mostest” ♡", "a letter: “you're my favourite person in da entire world”", "a letter: “the girls say goodnight mama ♡”", "a letter: “có anh ở đây” ♡", "a letter: “you + me = M + V. forever and ever”"];
function snacks() {
  sfx.pop(); world.snack = 2;
  toast("snacks on the picnic blanket! 🍓");
  KIDS.filter((k) => !k.home && !k.held).sort((a, b) => a.needs.hunger - b.needs.hunger).slice(0, 2).forEach((k) => { interrupt(k, "picnic"); say(k, "snacks!!", 1200); });
}

let drag = null;
canvas.addEventListener("pointerdown", (e) => {
  const p = toWorld(e);
  canvas.setPointerCapture(e.pointerId);
  drag = { k: mapMode ? null : kidAt(p), p, cx: e.clientX, cy: e.clientY, camX: cam.x, camY: cam.y, moved: false };
  if (mapMode) drag.k = kidAt(p);
});
canvas.addEventListener("pointermove", (e) => {
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.cx, e.clientY - drag.cy) > 6) {
    drag.moved = true;
    const k = drag.k;
    if (k) {
      audio(); sfx.squeak(); select(k);
      endStep(k); k.steps = []; k.path = []; k.held = true; k.act = "held"; k.label = "being carried by you ♡"; k.pose = "stand";
      say(k, pick(["wheee!", "put me down papa!", "mama i'm flying", "hehe"]), 1400);
    } else if (!mapMode) setCamMode("free");
  }
  if (!drag.moved) return;
  if (drag.k) { const p = toWorld(e); drag.k.x = clamp(p.x, 4, WW - 4); drag.k.y = clamp(p.y + 18, 20, WH - 4); }
  else if (!mapMode) { cam.x = drag.camX - (e.clientX - drag.cx) / scale; cam.y = drag.camY - (e.clientY - drag.cy) / scale; }
});
function drop(e) {
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.moved) { if (d.k) tapKid(d.k); else tapWorld(d.p) || select(null); return; }
  const k = d.k;
  if (!k) return;
  k.held = false;
  const [tx, ty] = tileOf(k.x, k.y);
  // dropped at the front door: off to bed
  if (Math.abs(tx - DOOR[0]) <= 1 && ty >= DOOR[1] - 2 && ty <= DOOR[1]) {
    [k.x, k.y] = feetOf(...DOOR);
    doActivity(k, "home");
    sfx.lullaby(); say(k, pick(GOODNIGHT));
    return;
  }
  if (tileAt(tx, ty) === WATER) { sfx.splash(); particle("splash", k.x, k.y, "#e8f7ff", 12, 6, -30); say(k, pick(["splash!! 💦", "i'm all wet papa!", "brrr cold!"]), 1600); }
  const [lx, ly] = walkable(tx, ty) ? [tx, ty] : nearestWalkable(tx, ty);
  const [fx, fy] = feetOf(lx, ly);
  k.lift = 14 + clamp(fy - k.y, 0, 30); // she drops down from where you let go
  k.x = fx; k.y = fy;
  if (tileAt(tx, ty) !== WATER) say(k, pick(["ta-da!", "again again!", "hehe", "where am i?"]), 1400);
  k.steps = [{ stay: 1.2, label: "landed!" }];
  k.act = "landed";
}
canvas.addEventListener("pointerup", drop);
canvas.addEventListener("pointercancel", drop);

$("#autoBtn").addEventListener("click", () => { audio(); sfx.pop(); if (mapMode) toggleMap(); select(null); setCamMode("auto"); toast("following whoever is having the most fun 🎥"); });
function toggleMap() {
  mapMode = !mapMode;
  $("#mapBtn").classList.toggle("on", mapMode);
  fit();
}
$("#mapBtn").addEventListener("click", () => { audio(); sfx.pop(); toggleMap(); });
$("#snackBtn").addEventListener("click", () => { audio(); snacks(); });

// ---------- the girls' chips ----------
const MOOD = (n) => (n.energy < 20 ? "🥱" : n.hunger < 25 ? "🥺" : (n.hunger + n.energy + n.fun + n.love) / 4 > 70 ? "🥰" : "😊");
KIDS.forEach((k) => {
  const c = document.createElement("button");
  c.type = "button"; c.className = "chip"; c.dataset.id = k.id;
  c.innerHTML = `<canvas width="${GW}" height="${GH}"></canvas><span class="txt"><b></b><small></small></span><span class="mood"></span>`;
  c.querySelector("b").textContent = k.name;
  c.querySelector("canvas").getContext("2d").drawImage(k.spr.front[0], 0, 0);
  c.addEventListener("click", () => { audio(); sfx.pop(); if (mapMode) toggleMap(); select(k); });
  k.chip = c;
  $("#dock").insertBefore(c, $("#dock .tools"));
});
function renderChips() {
  KIDS.forEach((k) => {
    k.chip.querySelector("small").textContent = k.home ? (k.asleep ? "asleep at home 💤" : "at home") : k.label;
    k.chip.querySelector(".mood").textContent = k.asleep ? "😴" : MOOD(k.needs);
  });
}

// ---------- remembering everything ----------
function save() {
  store.set("world", JSON.stringify({
    t: Date.now(),
    kids: Object.fromEntries(KIDS.map((k) => [k.id, { needs: k.needs, x: k.x, y: k.y, gift: k.gift }])),
    castle: CASTLE.level, shells: shells.length,
  }));
}
function catchUp(seconds) {
  const s = Math.min(seconds, 24 * 3600);
  KIDS.forEach((k) => {
    const n = k.needs;
    if (k.asleep) { n.energy = Math.min(100, n.energy + 0.25 * s); n.hunger -= 0.006 * s; }
    else { n.energy -= 0.012 * s; n.hunger -= 0.02 * s; n.fun -= 0.025 * s; }
    n.love -= 0.008 * s;
    for (const key in n) n[key] = clamp(n[key], 15, 100); // they look after each other while you're away
  });
  if (s > 3600 * 3) shells = SPOTS.sand.filter(([x, y]) => hash(x * 3, y * 7) % 7 === 0).map(([x, y]) => ({ x: x * T + 4 + (hash(x, y) % 8), y: y * T + 6 + (hash(y, x) % 6), kind: hash(x, y) % 3 })); // the tide brings new shells
}
(function load() {
  let saved = null;
  try { saved = JSON.parse(store.get("world") || "null"); } catch {}
  if (saved) {
    KIDS.forEach((k) => {
      const d = saved.kids?.[k.id];
      if (!d) return;
      Object.assign(k.needs, d.needs);
      const [tx, ty] = tileOf(d.x, d.y);
      if (walkable(tx, ty)) [k.x, k.y] = feetOf(tx, ty);
      k.gift = d.gift || null;
    });
    if (typeof saved.castle === "number") CASTLE.level = saved.castle;
    if (typeof saved.shells === "number") shells = shells.slice(0, saved.shells);
  }
  // anyone tucked in (here or on the main page) is asleep at home
  KIDS.forEach((k) => {
    if (sleepLog[k.id]) {
      k.home = true; k.asleep = true; k.act = "home"; [k.x, k.y] = feetOf(...DOOR);
      k.steps = ACTS.home.plan(k).slice(2);
    }
  });
  if (saved?.t) catchUp((Date.now() - saved.t) / 1000);
})();
setInterval(save, 8000);
addEventListener("pagehide", save);
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { hiddenAt = Date.now(); save(); }
  else if (hiddenAt) { catchUp((Date.now() - hiddenAt) / 1000); hiddenAt = 0; }
});

function tickClock() {
  const d = new Date();
  $("#clock").textContent = `${d.getHours() % 12 || 12}:${String(d.getMinutes()).padStart(2, "0")} ${d.getHours() < 12 ? "am" : "pm"} ${isNight() ? "🌙" : "☀️"}`;
}
tickClock(); setInterval(tickClock, 15000);
// the sea around the map gets dark at night too
function tintBackdrop() { const t = tintNow(), sea = [159, 214, 240]; view.style.background = `rgb(${sea.map((v, i) => Math.round(v + (t.rgb[i] - v) * t.a)).join(",")})`; }
tintBackdrop(); setInterval(tintBackdrop, 5000);
renderChips(); setInterval(renderChips, 500);
setTimeout(() => toast("tap a girl to follow her · drag to carry her · then tap the ground to call her over ♡", 5000), 800);

// start looking at someone
cam.target = KIDS.find((k) => !k.home) || KIDS[0];
{ const t = camTarget(); if (t) { cam.x = t[0] - canvas.width / 2; cam.y = t[1] - canvas.height / 2; } }

let last = performance.now();
function frame(now) {
  const dt = Math.min(now - last, 100) / 1000;
  last = now;
  updateWorld(dt);
  KIDS.forEach((k) => updateKid(k, dt));
  updateCamera(dt);
  draw();
  placeOverlays();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
