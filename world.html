<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>our little island ♡</title>
<meta name="description" content="mivi, vimi and teddy's little island">
<meta name="theme-color" content="#ffb7d0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 56C10 40 4 28 12 18c6-7 15-6 20 2 5-8 14-9 20-2 8 10 2 22-20 38z' fill='%23ffb7d0' stroke='%236b3a55' stroke-width='5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Pixelify+Sans:wght@400;600&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ffb7d0;
    --pink-deep: #f48fb4;
    --pink-soft: #ffe1ec;
    --yellow: #fff1a8;
    --yellow-deep: #ffd966;
    --cream: #fffaf0;
    --ink: #6b3a55;
    --white: #ffffff;
    --pixel: "Pixelify Sans", ui-monospace, monospace;
    --bubble: "Bagel Fat One", "Nunito", system-ui, sans-serif;
    --body: "Nunito", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column;
    height: 100dvh;
    color: var(--ink);
    font-family: var(--body);
    background: #fff3c4;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,170,200,.38) 0 34px, transparent 34px 50px, rgba(255,255,255,.85) 50px 52px, transparent 52px 55px, rgba(255,255,255,.85) 55px 57px, transparent 57px 60px, rgba(255,255,255,.85) 60px 62px, transparent 62px 90px, rgba(255,205,90,.55) 90px 94px, transparent 94px 120px),
      repeating-linear-gradient(90deg, rgba(255,170,200,.38) 0 34px, transparent 34px 50px, rgba(255,255,255,.85) 50px 52px, transparent 52px 55px, rgba(255,255,255,.85) 55px 57px, transparent 57px 60px, rgba(255,255,255,.85) 60px 62px, transparent 62px 90px, rgba(255,205,90,.55) 90px 94px, transparent 94px 120px);
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
    gap: 8px;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; }
  .top { display: flex; align-items: center; gap: 6px; flex: none; }
  .top h1 { flex: 1; margin: 0; min-width: 0; font: 400 clamp(18px, 4.6vw, 28px)/1 var(--bubble); color: var(--white);
    -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; text-shadow: 3px 3px 0 var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 4px 2px; }
  .pill {
    display: inline-flex; align-items: center; gap: 5px; flex: none;
    font: 600 14px/1 var(--pixel); color: var(--ink); text-decoration: none;
    background: var(--yellow); border: 2px solid var(--ink); border-radius: 999px;
    padding: 7px 11px; box-shadow: 2px 2px 0 var(--ink); cursor: pointer;
  }
  .pill.white { background: var(--white); }
  .pill.on { background: var(--pink); }
  .pill:active { transform: translate(2px,2px); box-shadow: none; }

  .win {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column;
    background: var(--cream);
    border: 3px solid var(--ink); border-radius: 14px;
    box-shadow: 5px 5px 0 var(--ink);
    overflow: hidden;
  }
  .titlebar {
    display: flex; align-items: center; gap: 8px; flex: none;
    padding: 5px 10px;
    background: linear-gradient(90deg, var(--pink) 0%, #ffd0de 55%, var(--yellow) 100%);
    border-bottom: 3px solid var(--ink);
    font: 600 13px/1.2 var(--pixel);
  }
  .titlebar .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .titlebar #clock { white-space: nowrap; }
  .view { position: relative; flex: 1; min-height: 0; background: #9fd6f0; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  .view canvas { position: absolute; image-rendering: pixelated; cursor: pointer; }
  .overlay { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .bubble {
    position: absolute; transform: translate(-50%, -100%) scale(.8);
    white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis;
    background: var(--white); border: 2px solid var(--ink); border-radius: 12px;
    padding: 4px 8px;
    font: 800 13px/1.2 var(--body); color: var(--ink);
    box-shadow: 2px 2px 0 var(--ink);
    opacity: 0; transition: opacity .15s, transform .15s;
  }
  .bubble.show { opacity: 1; transform: translate(-50%, -100%) scale(1); }
  .bubble.think { background: #fffaf0; border-style: dashed; font-style: italic; font-weight: 600; }
  .tag {
    position: absolute; transform: translate(-50%, 0);
    font: 600 11px/1 var(--pixel); color: var(--ink);
    background: var(--yellow); border: 2px solid var(--ink); border-radius: 999px;
    padding: 2px 6px; white-space: nowrap; opacity: 0; transition: opacity .2s;
  }
  .tag.show { opacity: 1; }
  .toast {
    position: absolute; left: 50%; bottom: 10px; transform: translate(-50%, 10px); z-index: 4;
    background: var(--ink); color: var(--yellow);
    font: 600 13px/1.3 var(--body); padding: 8px 14px; border-radius: 999px;
    opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none;
    width: max-content; max-width: calc(100% - 24px); text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .fade { position: absolute; inset: 0; background: #fffaf0; opacity: 0; pointer-events: none; transition: opacity .16s; z-index: 1; }
  .fade.on { opacity: 1; }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .5s; z-index: 5; }
  .flash.on { opacity: .9; transition: none; }

  /* where you are, top left of the view */
  .place {
    position: absolute; left: 8px; top: 8px; z-index: 2;
    display: inline-flex; align-items: center; gap: 6px;
    font: 600 13px/1 var(--pixel); color: var(--ink);
    background: var(--cream); border: 2px solid var(--ink); border-radius: 999px;
    padding: 6px 10px; box-shadow: 2px 2px 0 var(--ink); cursor: pointer;
  }
  .place:active { transform: translate(2px,2px); box-shadow: none; }
  .place small { font: 600 11px/1 var(--pixel); opacity: .75; }

  /* talking to her */
  .talklog p { margin: 4px 0 0; font: 700 11px/1.3 var(--body); }
  .talklog b { color: var(--pink-deep); }
  .talk { display: flex; gap: 4px; margin-top: 6px; }
  .talk input { flex: 1; min-width: 0; font: 700 12px/1 var(--body); color: var(--ink); background: var(--white); border: 2px solid var(--ink); border-radius: 999px; padding: 6px 9px; outline: none; }
  .talk input:focus { background: #fff6c9; }
  .talk button { flex: none; border: 2px solid var(--ink); border-radius: 999px; background: var(--pink); padding: 3px 8px; cursor: pointer; box-shadow: 2px 2px 0 var(--ink); }
  .teach { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
  .teach[hidden] { display: none; }
  .teach p { width: 100%; margin: 0; font: 800 11px/1.3 var(--body); }
  .teach button { font: 700 11px/1 var(--body); color: var(--ink); background: var(--pink-soft); border: 2px solid var(--ink); border-radius: 999px; padding: 4px 7px; cursor: pointer; }
  .teach button:active { transform: translate(1px,1px); }
  /* their diary */
  .diary { position: absolute; inset: 0; z-index: 4; display: grid; place-items: center; padding: 12px; background: rgba(74,43,58,.35); }
  .diary[hidden] { display: none; }
  .diary .paper { position: relative; width: min(440px, 100%); max-height: 100%; overflow: auto; padding: 14px 16px 10px; border: 3px solid var(--ink); border-radius: 14px; box-shadow: 5px 5px 0 var(--ink);
    background: #fffaf0 repeating-linear-gradient(0deg, transparent 0 23px, rgba(244,143,180,.35) 23px 24px); }
  .diary h2 { margin: 0 0 8px; font: 400 22px/1.1 var(--bubble); color: var(--pink-deep); }
  .diary .x { position: absolute; right: 8px; top: 6px; border: 0; background: none; font: 600 16px/1 var(--pixel); color: var(--ink); cursor: pointer; padding: 4px; }
  .diary .page { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 10px; }
  .diary .page canvas { width: 32px; height: 34px; image-rendering: pixelated; flex: none; position: static; }
  .diary .page p, .diary .empty { margin: 0; font: 700 13px/24px var(--body); }
  /* popped out into its own little window */
  body.pip { padding: 0; height: 100vh; }
  body.pip .win { height: 100vh; border-radius: 0; border: 0; box-shadow: none; }
  body.pip .titlebar { font-size: 11px; padding: 3px 8px; }
  body.pip .chip small { display: none; }
  body.pip .chip b { font-size: 13px; }
  body.pip .card { width: 170px; }
  body.popped::after { content: "the island is in its little window ⧉ ♡ (close it to bring it back)"; margin: auto; font: 600 16px/1.4 var(--pixel); text-align: center; }
  /* the mini map, top right */
  .view canvas.mini {
    position: absolute; right: 8px; top: 8px; left: auto; z-index: 2;
    border: 3px solid var(--ink); border-radius: 10px; box-shadow: 3px 3px 0 var(--ink);
    background: #9fd6f0; image-rendering: auto; cursor: crosshair;
  }

  /* the picked girl's little card */
  .card {
    position: absolute; right: 8px; top: 8px; z-index: 2; width: 206px;
    background: rgba(255,250,240,.96); border: 3px solid var(--ink); border-radius: 12px;
    box-shadow: 3px 3px 0 var(--ink); padding: 6px 8px 8px;
  }
  .card[hidden] { display: none; }
  .card .who { display: flex; gap: 6px; align-items: center; padding-right: 18px; }
  .card canvas { width: 32px; height: 34px; image-rendering: pixelated; flex: none; position: static; }
  .card b { display: block; font: 400 17px/1 var(--bubble); }
  .card small { display: block; font: 800 11px/1.25 var(--body); opacity: .85; }
  .card .x { position: absolute; right: 4px; top: 3px; border: 0; background: none; font: 600 15px/1 var(--pixel); color: var(--ink); cursor: pointer; padding: 4px; }
  .bars { display: grid; gap: 3px; margin-top: 6px; }
  .bar { display: grid; grid-template-columns: 16px 1fr; align-items: center; gap: 5px; font-size: 11px; }
  .bar i { display: block; height: 8px; border: 2px solid var(--ink); border-radius: 99px; background: var(--white); overflow: hidden; }
  .bar i span { display: block; height: 100%; background: var(--pink-deep); transition: width .4s; }
  .bar i span.low { background: var(--yellow-deep); }
  .mind { margin-top: 6px; border-top: 2px dashed rgba(107,58,85,.35); padding-top: 5px; display: grid; gap: 2px; }
  .mind p { margin: 0; font: 700 11px/1.3 var(--body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mind p.title { font: 600 11px/1.2 var(--pixel); opacity: .75; }

  .dock { display: flex; gap: 6px; padding: 6px; border-top: 3px solid var(--ink); background: var(--pink-soft); flex: none; }
  .chips { display: flex; gap: 6px; flex: 1; min-width: 0; }
  .chip {
    display: flex; align-items: center; gap: 6px; flex: 1 1 0; min-width: 0;
    background: var(--white); border: 2px solid var(--ink); border-radius: 12px;
    box-shadow: 2px 2px 0 var(--ink); padding: 3px 8px 3px 4px; cursor: pointer; text-align: left;
  }
  .chip.sel { background: #fff6c9; }
  .chip canvas { width: 32px; height: 34px; image-rendering: pixelated; flex: none; }
  .chip .txt { min-width: 0; flex: 1; }
  .chip b { display: block; font: 400 16px/1 var(--bubble); }
  .chip small { display: block; font: 800 11px/1.25 var(--body); opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tools { display: flex; gap: 6px; flex: none; align-items: center; }
  .tools .pill { padding: 7px 9px; font-size: 15px; }
  .tray {
    position: absolute; right: 8px; bottom: 8px; z-index: 3;
    display: none; grid-template-columns: repeat(2, auto); gap: 6px;
    background: var(--cream); border: 3px solid var(--ink); border-radius: 14px;
    box-shadow: 4px 4px 0 var(--ink); padding: 8px;
  }
  .tray.open { display: grid; animation: popin .18s ease; }
  @keyframes popin { from { transform: translateY(8px) scale(.96); opacity: 0; } }
  .tray button {
    font: 600 13px/1 var(--pixel); color: var(--ink); text-align: left; white-space: nowrap;
    background: var(--pink-soft); border: 2px solid var(--ink); border-radius: 10px;
    padding: 9px 10px; box-shadow: 2px 2px 0 var(--ink); cursor: pointer;
  }
  .tray button:active { transform: translate(2px,2px); box-shadow: none; }
  @media (max-width: 620px) {
    .chip { padding-right: 4px; gap: 3px; }
    .chip small { display: none; }
    .chip b { font-size: 13px; }
    .tools .pill { padding: 6px 7px; font-size: 14px; }
    .titlebar .name { font-size: 12px; }
    .card { width: 170px; }
    .place small { display: none; }
  }
  @media (max-width: 380px) {
    .chip canvas { width: 24px; height: 26px; }
    .chip b { font-size: 12px; }
  }
</style>
</head>
<body>

<div class="top">
  <a class="pill" href="./">← back</a>
  <h1>our little island</h1>
  <span class="pill white" id="gifts" title="presents from the girls">🌸 0</span>
  <button class="pill white" type="button" id="diaryBtn" title="read their diary" aria-label="their diary">📔</button>
  <button class="pill white" type="button" id="popBtn" title="pop the island out into a little window that stays on top" aria-label="pop out">⧉</button>
  <button class="pill white" type="button" id="soundBtn" aria-label="sound on or off">🔊</button>
</div>

<div class="win">
  <div class="titlebar"><span>🌴</span><span class="name">island.exe — mivi, vimi &amp; teddy</span><span id="clock"></span></div>
  <div class="view" id="view">
    <canvas id="scene"></canvas>
    <div class="overlay" id="overlay"></div>
    <button class="place" type="button" id="placeBtn"></button>
    <canvas class="mini" id="mini" aria-label="mini map, tap to look there"></canvas>
    <div class="card" id="card" hidden>
      <button class="x" type="button" id="cardX" aria-label="close">✕</button>
      <div class="who"><canvas id="cardPic" width="32" height="34"></canvas><div><b id="cardName"></b><small id="cardDoing"></small></div></div>
      <div class="bars" id="cardBars"></div>
      <div class="mind" id="cardMind"></div>
      <div class="talklog" id="talkLog"></div>
      <div class="teach" id="teach" hidden></div>
      <form class="talk" id="talk" autocomplete="off"><input id="talkIn" maxlength="200" placeholder="say something…" enterkeyhint="send"><button type="submit" aria-label="say it">💬</button></form>
    </div>
    <div class="fade" id="fade"></div>
    <div class="diary" id="diary" hidden>
      <div class="paper"><button class="x" type="button" id="diaryX" aria-label="close">✕</button><h2 id="diaryTitle">their diary 📔</h2><div id="diaryBody"></div></div>
    </div>
    <div class="toast" id="toast"></div>
    <div class="flash" id="flash"></div>
    <div class="tray" id="tray">
      <button type="button" data-toy="treat">🍰 a treat</button>
      <button type="button" data-toy="ball">⚽ ball</button>
      <button type="button" data-toy="bubbles">🫧 bubbles</button>
      <button type="button" data-toy="party">🎵 dance party</button>
      <button type="button" data-toy="dress">🎀 dress up</button>
      <button type="button" data-toy="photo">📸 photo</button>
    </div>
  </div>
  <div class="dock" id="dock">
    <div class="chips" id="chips"></div>
    <div class="tools">
      <button class="pill on" type="button" id="autoBtn" title="follow whoever is doing something fun" aria-label="auto camera">🎥</button>
      <button class="pill" type="button" id="mapBtn" title="see the whole place" aria-label="map">🗺️</button>
      <button class="pill" type="button" id="toyBtn" title="toys and things" aria-label="toys">🧸</button>
    </div>
  </div>
</div>

<script src="kids.js?v=202610211841"></script>
<script src="world.js?v=202610211841"></script>
</body>
</html>
